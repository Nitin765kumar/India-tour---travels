<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Booking | IndiaTours</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-deep: #020617;
            --card-bg: #0f172a;
            --accent-orange: #ff4d00;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --input-bg: #1e293b;
            --border-glow: rgba(255, 77, 0, 0.3);
        }

        body {
            background-color: var(--bg-deep);
            background-image: radial-gradient(circle at 50% -20%, #1e293b, #020617);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            margin: 0;
        }

        .booking-wrapper { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        
        /* Updated Back Link */
        .btn-back {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s;
            margin-bottom: 25px;
            display: inline-flex;
            align-items: center;
        }
        .btn-back:hover { color: var(--accent-orange); transform: translateX(-5px); }

        .glass-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Form Styling */
        .form-label {
            color: #cbd5e1; /* Light Slate for high contrast */
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 10px;
        }

        .form-control, .form-select {
            background-color: var(--input-bg) !important;
            border: 1px solid rgba(255,255,255,0.2) !important;
            color: #ffffff !important;
            padding: 14px;
            border-radius: 12px;
            font-size: 0.95rem;
        }

        .form-control::placeholder { color: rgba(255, 255, 255, 0.3) !important; }

        .form-control:focus {
            border-color: var(--accent-orange) !important;
            box-shadow: 0 0 0 4px var(--border-glow) !important;
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        /* Pricing Section */
        .price-display {
            font-size: 3rem;
            font-weight: 800;
            color: #fff;
            margin: 15px 0;
        }

        /* Action Buttons */
        .btn-row { display: flex; gap: 20px; margin-top: 40px; }

        /* FIXED: Points to packages.html */
        .btn-cancel-link {
            flex: 1;
            padding: 18px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            text-decoration: none;
            text-align: center;
            font-weight: 600;
            transition: 0.3s;
        }
        .btn-cancel-link:hover {
            background: rgba(239, 68, 68, 0.1);
            border-color: #ef4444;
            color: #ef4444;
        }

        .btn-submit-main {
            flex: 1;
            padding: 18px;
            border-radius: 15px;
            background: var(--accent-orange);
            color: white;
            border: none;
            font-weight: 700;
            transition: 0.3s;
        }
        .btn-submit-main:hover {
            background: #e64500;
            transform: translateY(-3px);
            box-shadow: 0 15px 30px var(--border-glow);
        }

        .currency-pill {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 6px 14px;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="booking-wrapper">
    <a href="packages.html" class="btn-back">
        <i class="fas fa-arrow-left me-2"></i> Back to Packages
    </a>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="glass-card">
                <h2 class="fw-bold mb-4">Passenger Information</h2>
                <form id="bookingForm" action="payment.html">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">First Name</label>
                            <input type="text" class="form-control" placeholder="e.g. Nitin" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Last Name</label>
                            <input type="text" class="form-control" placeholder="e.g. Kumar" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Email Address</label>
                            <input type="email" class="form-control" placeholder="nitin@example.com" required>
                        </div>

                        <div class="col-12 my-4"><hr class="opacity-10"></div>

                        <h4 class="fw-bold mb-3">Booking Details</h4>
                        <div class="col-md-7">
                            <label class="form-label">Selected Package</label>
                            <select class="form-select" id="packageSelect">
                                <option value="4999">Agra Heritage - ₹4,999</option>
                                <option value="6999">Goa Beach Bliss - ₹6,999</option>
                                <option value="8999">Manali Snow Peaks - ₹8,999</option>
                            </select>
                        </div>
                        <div class="col-md-5">
                            <label class="form-label">Travel Date</label>
                            <input type="date" class="form-control" id="travelDate" required>
                        </div>

                        <div class="btn-row">
                            <a href="packages.html" class="btn-cancel-link">CANCEL BOOKING</a>
                            <button type="submit" class="btn-submit-main">CONFIRM & PAY <i class="fas fa-arrow-right ms-2"></i></button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="glass-card">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="fw-bold m-0">Order Summary</h5>
                    <select id="currencySelect" class="currency-pill bg-dark">
                        <option value="INR">INR (₹)</option>
                        <option value="USD">USD ($)</option>
                        <option value="EUR">EUR (€)</option>
                        <option value="GBP">GBP (£)</option>
                    </select>
                </div>

                <div class="d-flex justify-content-between text-muted mb-2">
                    <span>Base Fare</span>
                    <span id="base_price">₹4,999</span>
                </div>
                <div class="d-flex justify-content-between text-muted mb-4">
                    <span>GST (5%)</span>
                    <span id="tax_price">₹250</span>
                </div>

                <div class="border-top border-secondary opacity-20 my-4"></div>

                <label class="form-label text-muted mb-0">TOTAL AMOUNT</label>
                <div class="price-display" id="total_inr">₹5,249</div>
                <div id="exchange_rate_display" class="h5 mt-2 text-success fw-bold"></div>

                <div class="mt-5 p-3 rounded-4 bg-white bg-opacity-5 border border-white border-opacity-10 text-center">
                    <div class="d-flex align-items-center justify-content-center gap-2">
                        <i class="fas fa-lock text-success"></i>
                        <span class="small text-muted">SECURE CHECKOUT</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const packageSelect = document.getElementById('packageSelect');
    const currencySelect = document.getElementById('currencySelect');
    const totalInrDisp = document.getElementById('total_inr');
    const exchangeDisp = document.getElementById('exchange_rate_display');

    // 1. Calculate & Update UI
    async function updateBooking() {
        const baseVal = parseInt(packageSelect.value);
        const taxVal = Math.round(baseVal * 0.05);
        const totalINR = baseVal + taxVal;

        document.getElementById('base_price').innerText = '₹' + baseVal.toLocaleString('en-IN');
        document.getElementById('tax_price').innerText = '₹' + taxVal.toLocaleString('en-IN');
        totalInrDisp.innerText = '₹' + totalINR.toLocaleString('en-IN');

        const targetCurrency = currencySelect.value;
        if(targetCurrency === 'INR') {
            exchangeDisp.innerText = "";
        } else {
            try {
                // Real-time Exchange Fetch
                const response = await fetch(`https://open.er-api.com/v6/latest/INR`);
                const data = await response.json();
                const rate = data.rates[targetCurrency];
                const converted = (totalINR * rate).toFixed(2);
                
                const symbols = { USD: '$', EUR: '€', GBP: '£' };
                exchangeDisp.innerText = `${symbols[targetCurrency]}${converted} ${targetCurrency}`;
            } catch (error) {
                exchangeDisp.innerText = "Rates Sync Error";
            }
        }
    }

    // Set min date to today automatically
    document.getElementById('travelDate').min = new Date().toISOString().split('T')[0];

    // Listeners
    packageSelect.addEventListener('change', updateBooking);
    currencySelect.addEventListener('change', updateBooking);

    // Run Initial State
    updateBooking();

    // Submit Handling
    document.getElementById('bookingForm').addEventListener('submit', (e) => {
        const btn = e.target.querySelector('.btn-submit-main');
        btn.innerHTML = '<i class="fas fa-circle-notch fa-spin me-2"></i> PROCESSING...';
        btn.style.opacity = '0.7';
        btn.style.pointerEvents = 'none';
    });
</script>

</body>
</html>
