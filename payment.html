<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout | IndiaTours</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --navy: #050a15;
            --card-bg: #112240;
            --orange: #ff4d00;
            --text-muted: #8892b0;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            background: radial-gradient(circle at top right, #112240, #050a15);
            color: white;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
        }

        /* Progress Steps */
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }
        .step {
            width: 35px; height: 35px;
            border-radius: 50%;
            background: var(--glass);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.9rem; border: 1px solid rgba(255,255,255,0.1);
        }
        .step.active { background: var(--orange); border-color: var(--orange); box-shadow: 0 0 15px rgba(255, 77, 0, 0.4); }
        .step.done { background: #28a745; border-color: #28a745; }

        /* Main Glass Box */
        .checkout-container {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }

        /* Tabs */
        .nav-pills .nav-link {
            color: var(--text-muted);
            padding: 12px 25px;
            border-radius: 12px;
            transition: 0.3s;
            border: 1px solid transparent;
        }
        .nav-pills .nav-link.active {
            background: rgba(255, 77, 0, 0.1) !important;
            color: var(--orange) !important;
            border: 1px solid var(--orange);
        }

        /* Form Inputs */
        .form-control {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 12px 15px;
            border-radius: 10px;
        }
        .form-control:focus {
            background: rgba(0, 0, 0, 0.3);
            border-color: var(--orange);
            color: white;
            box-shadow: none;
        }

        /* Card Preview Visualization */
        .card-visual {
            background: linear-gradient(135deg, #ff4d00, #ff8c00);
            border-radius: 15px;
            padding: 20px;
            height: 180px;
            position: relative;
            margin-bottom: 25px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .chip { width: 40px; height: 30px; background: #ffd700; border-radius: 5px; margin-bottom: 20px; }

        .btn-pay {
            background: linear-gradient(45deg, var(--orange), #ff7b00);
            border: none; color: white; padding: 15px;
            font-weight: 600; border-radius: 12px; transition: 0.3s;
        }
        .btn-pay:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(255, 77, 0, 0.3); color: white; }

        .qr-wrapper {
            background: white; padding: 20px; border-radius: 20px;
            display: inline-block; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Loader Overlay */
        #loader {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 10, 21, 0.95); z-index: 9999;
            align-items: center; justify-content: center; flex-direction: column;
        }
    </style>
</head>

<body>

<div class="container py-5">
    <!-- Steps -->
    <div class="step-indicator">
        <div class="step done"><i class="fa-solid fa-check"></i></div>
        <div class="step active">2</div>
        <div class="step">3</div>
    </div>

    <div class="row justify-content-center g-4">
        <!-- Payment Options -->
        <div class="col-lg-7">
            <div class="checkout-container p-4 p-md-5">
                <div class="d-flex align-items-center mb-4">
                    <div class="bg-success rounded-circle p-2 me-3" style="--bs-bg-opacity: .2;">
                        <i class="fa-solid fa-shield-halved text-success fs-4"></i>
                    </div>
                    <div>
                        <h4 class="mb-0 fw-bold">Payment Secure</h4>
                        <p class="text-muted small mb-0">Encrypted by 256-bit SSL</p>
                    </div>
                </div>

                <ul class="nav nav-pills mb-4 gap-2" id="pills-tab">
                    <li class="nav-item">
                        <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#upi-pane">
                            <i class="fa-solid fa-mobile-screen-button me-2"></i>UPI / QR
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" data-bs-toggle="pill" data-bs-target="#card-pane">
                            <i class="fa-solid fa-credit-card me-2"></i>Debit/Credit Card
                        </button>
                    </li>
                </ul>

                <div class="tab-content">
                    <!-- UPI SECTION -->
                    <div class="tab-pane fade show active" id="upi-pane">
                        <div class="text-center py-3">
                            <div class="qr-wrapper mb-4">
                                <img id="qrImage" alt="Payment QR" width="180">
                            </div>
                            <h6 class="text-white-50 mb-4">Scan QR with any UPI app to pay</h6>
                            
                            <div class="d-flex align-items-center mb-4 text-white-50">
                                <hr class="flex-grow-1"> <span class="mx-3 small">OR USE VPA</span> <hr class="flex-grow-1">
                            </div>

                            <form id="upiForm">
                                <div class="input-group mb-3">
                                    <input type="text" class="form-control" placeholder="example@upi" required>
                                    <button class="btn btn-orange px-4">Verify</button>
                                </div>
                                <button type="submit" class="btn btn-pay w-100">Pay Now</button>
                            </form>
                        </div>
                    </div>

                    <!-- CARD SECTION -->
                    <div class="tab-pane fade" id="card-pane">
                        <div class="card-visual">
                            <div class="d-flex justify-content-between align-items-start">
                                <div class="chip"></div>
                                <i class="fa-brands fa-cc-visa fs-2"></i>
                            </div>
                            <h4 class="mb-4 tracking-widest mt-2" id="cardDisplay">**** **** **** ****</h4>
                            <div class="d-flex justify-content-between">
                                <small class="text-uppercase" id="nameDisplay">Card Holder</small>
                                <small id="expiryDisplay">MM/YY</small>
                            </div>
                        </div>

                        <form id="cardForm">
                            <div class="mb-3">
                                <label class="small text-white-50 mb-2">Card Number</label>
                                <input type="text" class="form-control" maxlength="19" placeholder="0000 0000 0000 0000" id="cardInput" required>
                            </div>
                            <div class="mb-3">
                                <label class="small text-white-50 mb-2">Card Holder Name</label>
                                <input type="text" class="form-control" placeholder="John Doe" id="nameInput" required>
                            </div>
                            <div class="row g-3 mb-4">
                                <div class="col-6">
                                    <label class="small text-white-50 mb-2">Expiry Date</label>
                                    <input type="text" class="form-control" placeholder="MM/YY" maxlength="5" id="expiryInput" required>
                                </div>
                                <div class="col-6">
                                    <label class="small text-white-50 mb-2">CVV</label>
                                    <input type="password" class="form-control" placeholder="***" maxlength="3" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-pay w-100">Proceed to Pay</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Summary Sidebar -->
        <div class="col-lg-4">
            <div class="checkout-container p-4">
                <h5 class="fw-bold mb-4">Summary</h5>
                <div class="d-flex justify-content-between mb-3">
                    <span class="text-white-50">Package</span>
                    <span id="pkgName" class="fw-medium">---</span>
                </div>
                <div class="d-flex justify-content-between mb-3">
                    <span class="text-white-50">Travelers</span>
                    <span id="travelerCount" class="fw-medium">1</span>
                </div>
                <div class="d-flex justify-content-between mb-3">
                    <span class="text-white-50">Tax & Fees</span>
                    <span class="text-success fw-medium">Included</span>
                </div>
                <hr style="border-color: rgba(255,255,255,0.1);">
                <div class="d-flex justify-content-between align-items-center mt-4">
                    <h6 class="mb-0">Payable Amount</h6>
                    <h3 id="totalAmount" class="text-orange fw-bold mb-0">₹0</h3>
                </div>

                <div class="mt-5 pt-3 text-center">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/b/b5/PayPal.svg" height="20" class="mx-2 opacity-50">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/5/5e/Visa_Inc._logo.svg" height="15" class="mx-2 opacity-50">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/2/2a/Mastercard-logo.svg" height="20" class="mx-2 opacity-50">
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Loader -->
<div id="loader">
    <div class="spinner-border text-orange mb-3" style="width: 3rem; height: 3rem;"></div>
    <h5 class="fw-bold">Authenticating...</h5>
    <p class="text-white-50 small">Please do not refresh the page</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // ✅ URL DATA PARSING
    const params = new URLSearchParams(window.location.search);
    const travelers = parseInt(params.get("travelerCount")) || 1; // updated key to match booking.html
    const pkgName = params.get("packageName") || "Luxury Tour";
    const totalAmount = params.get("totalAmount") || "0";

    document.getElementById("pkgName").innerText = pkgName;
    document.getElementById("travelerCount").innerText = travelers;
    document.getElementById("totalAmount").innerText = "₹" + parseInt(totalAmount).toLocaleString();

    // ✅ QR CODE GENERATION
    const upiID = "indiantours@upi";
    const upiString = `upi://pay?pa=${upiID}&pn=IndiaTours&am=${totalAmount}&cu=INR`;
    document.getElementById("qrImage").src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(upiString)}`;

    // ✅ LIVE CARD PREVIEW
    const cardInput = document.getElementById('cardInput');
    const nameInput = document.getElementById('nameInput');
    const expiryInput = document.getElementById('expiryInput');

    cardInput.addEventListener('input', (e) => {
        let val = e.target.value.replace(/\s+/g, '').replace(/[^0-9]/gi, '');
        let formatted = val.match(/.{1,4}/g)?.join(' ') || '';
        e.target.value = formatted;
        document.getElementById('cardDisplay').innerText = formatted || "**** **** **** ****";
    });

    nameInput.addEventListener('input', (e) => {
        document.getElementById('nameDisplay').innerText = e.target.value || "Card Holder";
    });

    expiryInput.addEventListener('input', (e) => {
        let val = e.target.value.replace(/[^0-9]/g, '');
        if (val.length > 2) val = val.substring(0,2) + '/' + val.substring(2,4);
        e.target.value = val;
        document.getElementById('expiryDisplay').innerText = val || "MM/YY";
    });

    // ✅ PAYMENT SIMULATION
    const forms = ['upiForm', 'cardForm'];
    forms.forEach(id => {
        document.getElementById(id).addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById("loader").style.display = "flex";
            
            setTimeout(() => {
                const ref = "IT" + Math.floor(Math.random() * 1000000);
                window.location.href = `confirmation.html?ref=${ref}&amount=${totalAmount}&pkg=${pkgName}`;
            }, 3000);
        });
    });
</script>

</body>
</html>
